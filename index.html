      <div class="lnote">Chaque case compte comme une réponse : tes statistiques et tes erreurs se remplissent case par case.</div>
    </div>`:''}

    <button class="btn btn-p btn-w" onclick="UI.launch()" ${blocked?'disabled':''}>
      ${MODES[UI.selMode].icon} Lancer · ${MODES[UI.selMode].label} ${cfg.label}
    </button>
  </div>`;
}

/* ---------- jeu ---------- */
function rGame(){
  const g=GAMES[sess.game];
  return `<div class="wrap fadeUp" style="padding-top:10px">
    <div class="ghead">
      <button class="back" style="margin:0;padding:6px 0" onclick="UI.quitGame()">✕ Quitter</button>
      <div class="gstats">
        ${sess.mode==='chrono'?`<div class="gstat tm"><b id="g-clock">1:00</b><span>temps</span></div>`:''}
        ${sess.mode==='survie'?`<div class="gstat"><div class="lives" id="g-lives">${rLives()}</div><span>vies</span></div>`:''}
        <div class="gstat ok"><b id="g-ok">0</b><span>justes</span></div>
        <div class="gstat er"><b id="g-err">0</b><span>fautes</span></div>
        <div class="gstat cb" id="g-combo" style="display:none"><b>🔥0</b><span>série</span></div>
      </div>
    </div>
    ${(sess.mode==='chrono'||questionTime()>0)?`<div class="tbar"><div id="g-tfill" style="width:100%"></div></div>`:''}
    <div class="qcard" id="g-card" style="--gc:${GAMES[sess.game].color}">
      <span class="suit">${g.suit}</span>
      <div><span class="qbadge" id="g-badge">${g.icon} …</span></div>
      <div class="qtext" id="g-q"></div>
      <div id="g-extra"></div>
      <div class="qhint" id="g-hint"></div>
    </div>
    <div id="g-answer"></div>
    <div class="fbk-slot" id="g-fbk"></div>
    ${sess.mode==='libre'?`<button class="btn btn-s btn-w" style="margin-top:12px" onclick="endSession()">🏁 Terminer la session</button>`:''}
  </div>`;
}
const KPAD_HTML=`<div class="ansbox" id="g-ans"><span class="ph">Ta réponse…</span></div>
    <div class="kpad">
      <button type="button" onclick="UI.key('7')">7</button><button type="button" onclick="UI.key('8')">8</button><button type="button" onclick="UI.key('9')">9</button><button type="button" class="fn" onclick="UI.key('back')">⌫</button>
      <button type="button" onclick="UI.key('4')">4</button><button type="button" onclick="UI.key('5')">5</button><button type="button" onclick="UI.key('6')">6</button><button type="button" class="fn" onclick="UI.key('clear')">C</button>
      <button type="button" onclick="UI.key('1')">1</button><button type="button" onclick="UI.key('2')">2</button><button type="button" onclick="UI.key('3')">3</button><button type="button" class="fn" onclick="UI.key('.')">,</button>
      <button type="button" class="zero" onclick="UI.key('0')">0</button><button type="button" class="zero" onclick="UI.key('00')">00</button>
      <button type="button" class="go" onclick="UI.key('go')">Valider ✓</button>
    </div>`;
function rLives(){return [0,1,2].map(i=>`<span class="${i<sess.lives?'on':''}">❤️</span>`).join('');}

/* mini-roue : ordre réel du cylindre, numéros mis en avant */
function rWheelMini(focus,hi){
  const F=focus||[],H=hi||[];
  return `<div class="wheel-mini">${WHEEL.map(n=>{
    const cl=H.includes(n)?'hi':F.includes(n)?'fo':'';
    return `<span class="wn ${cl} ${n===0?'z':isRed(n)?'r':'b'}">${n}</span>`;
  }).join('')}</div>`;
}
/* décomposition visuelle d'une figure / picture bet */
function rParts(parts,denom){
  const NAMES={35:'plein',17:'cheval',11:'transversale',8:'carré',5:'sixain',6:'pièces',9:'pièces',4:'pièces'};
  return `<div class="parts">${parts.map(p=>{
    const nm=p[2]||NAMES[p[1]]||'';
    return `<span class="pt"><b>${p[0]}</b>${nm?' '+plu(p[0],nm):''}<i>×${p[1]}</i></span>`;
  }).join('')}${denom?`<span class="pt dn">pièces de <b>${denom}</b></span>`:''}</div>`;
}

function paintQuestion(){
  const q=sess.q,g=GAMES[q.game]||GAMES.mix;
  const card=$('g-card');if(!card)return;
  card.classList.remove('ok','ko');
  card.style.setProperty('--gc',g.color);
  card.querySelector('.suit').textContent=g.suit;
  $('g-badge').innerHTML=`${g.icon} ${esc(q.isRevision?'Révision · '+q.ctx:q.ctx)}`;
  const qt=$('g-q');
  qt.textContent=q.q;
  qt.classList.toggle('long',q.q.length>22);
  // visuel contextuel : roue pour le cylindre, décomposition pour les figures
  const ex=$('g-extra');
  if(ex){
    // La mini-roue liste les 37 cases DANS L'ORDRE : l'afficher pendant une
    // question de cylindre donnerait la réponse. On ne montre donc que le
    // strict nécessaire ici, le reste est révélé dans le retour.
    if(q.seq)ex.innerHTML=rSeq();
    else if(q.chipsView)ex.innerHTML=rChips(q.chipsView);
    else if(q.choices)ex.innerHTML=q.annHit!=null?rWheelMini([],[q.annHit]):'';
    else if(q.parts&&q.parts.length)ex.innerHTML=rParts(q.parts,q.denom);
    else ex.innerHTML='';
  }
  // l'indice donne la réponse sur les QCM et les séquences : gardé pour le retour
  $('g-hint').textContent=(q.choices||q.seq)?(q.seqHelp||''):(q.hint||'');
  $('g-fbk').innerHTML='';
  // zone de réponse : choix multiples ou clavier numérique
  const an=$('g-answer');
  if(an){
    if(q.choices)an.innerHTML=`<div class="choices">${q.choices.map((c,i)=>
      `<button type="button" class="ch" id="ch-${i}" onclick="UI.choose(${i})">${esc(c)}</button>`).join('')}</div>`;
    else an.innerHTML=KPAD_HTML;
  }
  if(sess.qLimit>0){const b=$('g-tfill');if(b){b.style.width='100%';b.className='';}}
  paintAns();
}

/* piles de jetons colorées */
function rChips(view){
  return `<div class="chipsrow">${view.map(p=>{
    const ci=chipInfo(p.v);
    return `<div class="cstack"><div class="cst">${Array.from({length:Math.min(p.n,8)},(_,i)=>
      `<span class="cdisc" style="background:${ci.c};bottom:${i*5}px"></span>`).join('')}</div>
      <div class="clab"><b>${p.n}</b>×${p.v}</div></div>`;
  }).join('')}</div>`;
}

/* cases d'une séquence (voisins, cylindre) */
function rSeq(){
  const q=sess.q;
  return `<div class="seqwrap"><div class="seqbox">${q.seq.map((v,i)=>{
    const s=sess.seqVals[i];
    const cur=i===sess.seqIdx&&!sess.locked;
    let cl='sq',txt='·';
    if(s&&s.given){cl+=' given';txt=s.v;}
    else if(s){cl+=s.ok?' ok':' ko';txt=s.ok?s.v:(s.v<0?'—':s.v);}
    else if(cur)cl+=' cur';
    return `<span class="${cl}">${txt}</span>`;
  }).join('')}</div>
  <div class="seqcount mono">${sess.seqVals.filter(Boolean).length}/${q.seq.length}</div></div>`;
}
function paintSeq(){
  const ex=$('g-extra');if(ex)ex.innerHTML=rSeq();
  paintAns();
}
function paintSeqDone(allOk){
  const q=sess.q,fb=$('g-fbk'),card=$('g-card');
  if(card)card.classList.add(allOk?'ok':'ko');
  const wrong=sess.seqVals.map((s,i)=>(s&&!s.ok)?`${q.seq[i]}`:null).filter(Boolean);
  if(fb)fb.innerHTML=allOk
    ? `<div class="fbk ok">✓ Séquence complète !</div>`
    : `<div class="fbk ko">Suite exacte : <span class="big mono">${q.seq.join(' · ')}</span><span class="tip">${wrong.length} erreur(s) — regarde la roue ci-dessus</span></div>`;
  const ex=$('g-extra');
  if(ex&&q.revealFocus)ex.innerHTML=rSeq()+rWheelMini(q.revealFocus,q.revealHi);
}
function paintAns(){
  const el=$('g-ans');if(!el||(sess.q&&sess.q.choices))return;
  el.classList.remove('ok','ko');
  const ph=(sess.q&&sess.q.seq)?`Case ${sess.seqIdx+1}…`:'Ta réponse…';
  el.innerHTML=sess.ans?`${esc(sess.ans.replace('.',','))}<span class="crt"></span>`:`<span class="ph">${ph}</span><span class="crt"></span>`;
}
function paintStats(){
  const ok=$('g-ok'),er=$('g-err');
  if(ok)ok.textContent=sess.ok;
  if(er)er.textContent=sess.err;
  const cb=$('g-combo');
  if(cb){
    if(sess.combo>=3){cb.style.display='';cb.querySelector('b').textContent='🔥'+sess.combo;}
    else cb.style.display='none';
  }
  const lv=$('g-lives');if(lv)lv.innerHTML=rLives();
}
function paintFeedback(ok,timedOut){
  const card=$('g-card'),ab=$('g-ans'),fb=$('g-fbk'),q=sess.q;
  if(!card)return;
  card.classList.add(ok?'ok':'ko');
  if(ab)ab.classList.add(ok?'ok':'ko');
  const good=q.choices?q.choices[q.ansIdx]:fmtN(q.ans);
  if(q.choices){ // met en évidence la bonne / la mauvaise réponse
    const cg=$('ch-'+q.ansIdx);if(cg)cg.classList.add('good');
    if(!ok&&sess.pickedIdx!=null){const cb=$('ch-'+sess.pickedIdx);if(cb)cb.classList.add('bad');}
    const box=document.querySelector('.choices');if(box)box.classList.add('locked');
  }
  // on révèle après coup ce qui aurait trahi la réponse pendant la question
  const ex=$('g-extra'),hn=$('g-hint');
  if(q.ann&&ex)ex.innerHTML=rWheelMini(annNums(ANNONCES.find(a=>a.id===q.ann)||ANNONCES[0]),q.annHit!=null?[q.annHit]:[]);
  else if(q.wheelFocus&&ex)ex.innerHTML=rWheelMini(q.wheelFocus,q.wheelHi);
  if(hn&&(q.choices||q.wheelFocus))hn.textContent=q.hint||'';
  if(ok){
    fb.innerHTML=`<div class="fbk ok">✓ Exact ! <span class="big mono">${esc(good)}</span></div>`;
  }else{
    fb.innerHTML=`<div class="fbk ko">${timedOut?'⏱ Temps écoulé':'✗ Raté'} — réponse : <span class="big mono">${esc(good)}</span>${q.hint?`<span class="tip">${esc(q.hint)}</span>`:''}</div>`;
  }
  if(sess.combo>=4){
    const old=document.querySelector('.combo-pop');if(old)old.remove();
    const cp=document.createElement('div');
    cp.className='combo-pop';
    cp.innerHTML=`<b>×${Math.min(1+Math.floor(sess.combo/4),3)}</b><span>combo</span>`;
    document.body.appendChild(cp);
    setTimeout(()=>cp.remove(),900);
  }
}

/* ---------- résultats ---------- */
function rResults({record}){
  const n=sess.ok+sess.err,acc=n?Math.round(sess.ok/n*100):0;
  const avg=sess.times.length?(sess.times.reduce((a,b)=>a+b,0)/sess.times.length/1000):0;
  let grade,gc,msg;
  if(n>=8&&acc>=95){grade='S';gc='var(--gold)';msg='Niveau direction de salle !';}
  else if(acc>=85){grade='A';gc='var(--accent)';msg='Excellent travail !';}
  else if(acc>=70){grade='B';gc='var(--blue)';msg='Solide, continue !';}
  else if(acc>=50){grade='C';gc='var(--purple)';msg='Ça progresse !';}
  else{grade='D';gc='var(--red)';msg='On reprend les bases.';}
  const circ=2*Math.PI*45,off=circ*(1-acc/100);
  const g=GAMES[sess.game],m=MODES[sess.mode];
  return `<div class="wrap fadeUp">
    ${rHeader()}
    <div class="rcard">
      <div class="grade-wrap">
        <svg width="108" height="108" viewBox="0 0 108 108">
          <circle cx="54" cy="54" r="45" fill="none" stroke="var(--bg2)" stroke-width="9"/>
          <circle cx="54" cy="54" r="45" fill="none" stroke="${gc}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s ease;animation:ringIn 1s ease"/>
        </svg>
        <div class="gl" style="color:${gc}">${grade}</div>
      </div>
      <div class="rtitle">${sess.isRevision?'Révision terminée':'Session terminée'}</div>
      <div class="rsub">${g.icon} ${g.name} · ${m.label} ${DIFFS[sess.diff].label} — ${msg}</div>
      ${record?'<div class="rrec">🏆 Nouveau record personnel !</div>':''}
      <div class="rgrid">
        <div class="rstat"><b style="color:var(--accent)">${sess.ok}</b><span>justes</span></div>
        <div class="rstat"><b style="color:var(--red)">${sess.err}</b><span>fautes</span></div>
        <div class="rstat"><b style="color:var(--gold)">${acc}%</b><span>précision</span></div>
      </div>
      <div class="rgrid">
        <div class="rstat"><b>🔥${sess.bestCombo}</b><span>meilleure série</span></div>
        <div class="rstat"><b>${avg?avg.toFixed(1)+'s':'—'}</b><span>temps moyen</span></div>
        <div class="rstat"><b class="mono" style="color:var(--blue)">Nv.${levelInfo(S.xp).level}</b><span>niveau</span></div>
      </div>
      <div class="rxp">⭐ <b>+${sess.xp} XP</b><span>· ${DIFFS[sess.diff].label} ×${DIFFS[sess.diff].xp}${sess.mode==='survie'?' · Survie ×1.2':''}</span></div>
      <div class="ract">
        <button class="btn btn-s" onclick="UI.home()">Menu</button>
        <button class="btn btn-p" onclick="UI.replay()">↻ Rejouer</button>
      </div>
    </div>
  </div>`;
}

/* ---------- stats ---------- */
function rStats(){
  const acc=S.total?Math.round(S.correct/S.total*100):0;
  const li=levelInfo(S.xp),r=getRank(S.xp),nx=getNextRank(S.xp);
  const avg=S.timeN?(S.timeMs/S.timeN/1000).toFixed(1)+'s':'—';
  const pct=nx?Math.round((S.xp-r.min)/(nx.min-r.min)*100):100;
  // 7 derniers jours
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({l:['D','L','M','M','J','V','S'][d.getDay()],n:S.daily[k]||0});
  }
  const mx=Math.max(...days.map(d=>d.n),1);
  const fmtDate=t=>{const d=new Date(t);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;};
  return `<div class="wrap fadeUp">
    ${rHeader()}
    <button class="back" onclick="UI.home()">← Retour</button>

    <div class="career">
      <div class="career-top">
        <div class="rank-ic" style="background:${r.bg}">${r.icon}</div>
        <div class="career-info">
          <div class="career-name">${r.name} <span class="lvl-tag">Nv.${li.level}</span></div>
          <div class="career-sub">${li.into}/${li.need} XP vers le niveau ${li.level+1}</div>
        </div>
        <div class="career-xpnum"><b class="mono">${S.xp}</b><span>XP total</span></div>
      </div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
      <div class="pbar-tx"><span>${r.name}</span>${nx?`<span><b>${nx.min-S.xp} XP</b> → ${nx.icon} ${nx.name}</span>`:'<span style="color:var(--gold)">🏆 Grade maximum</span>'}</div>
    </div>

    <div class="panel">
      <div class="panel-t">📈 Vue d’ensemble</div>
      <div class="stgrid">
        <div class="stcard"><b>${S.total}</b><span>questions</span></div>
        <div class="stcard"><b class="g">${acc}%</b><span>précision</span></div>
        <div class="stcard"><b class="y">🔥${S.bestStreak}</b><span>record série</span></div>
        <div class="stcard"><b class="b">${avg}</b><span>tps moyen</span></div>
        <div class="stcard"><b class="p">${S.streakDays||0}j</b><span>assiduité</span></div>
        <div class="stcard"><b>${S.errors.length}</b><span>à réviser</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-t">📅 Activité · 7 jours</div>
      <div class="spark">
        ${days.map(d=>`<div><div class="bar" style="height:${Math.max(3,d.n/mx*44)}px"></div><div class="dl">${d.l}</div></div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-t">🎯 Précision par jeu</div>
      ${Object.keys(GAMES).filter(k=>S.byGame[k]&&S.byGame[k].t).map(k=>{
        const st=S.byGame[k],a=Math.round(st.c/st.t*100);
        const c=a>=80?'var(--accent)':a>=60?'var(--gold)':'var(--red)';
        return `<div class="perf">
          <div class="perf-h"><span class="nm">${GAMES[k].icon} ${GAMES[k].name}</span><span class="vl">${a}% (${st.c}/${st.t})</span></div>
          <div class="perf-b"><div style="width:${a}%;background:${c}"></div></div>
        </div>`;
      }).join('')||'<div style="font-size:12px;color:var(--muted)">Joue une première session pour voir tes stats.</div>'}
    </div>

    ${S.sessions.length?`<div class="panel">
      <div class="panel-t">🕐 Dernières sessions</div>
      ${S.sessions.slice(0,8).map(s=>{
        const g=GAMES[s.g]||GAMES.mix;
        return `<div class="sess">
          <div class="l"><span class="ic">${s.rev?'🔄':g.icon}</span><span>${s.rev?'Révision':g.name}<span class="m"> · ${MODES[s.m]?MODES[s.m].label:s.m} ${DIFFS[s.df]?DIFFS[s.df].label:''} · ${fmtDate(s.d)}</span></span></div>
          <div class="r"><b>${s.ok}✓</b> ${s.err}✗ · +${s.xp}xp</div>
        </div>`;
      }).join('')}
    </div>`:''}

    <button class="btn btn-s btn-w" onclick="UI.resetAll()">🗑️ Réinitialiser les données</button>
  </div>`;
}

/* ---------- réglages ---------- */
function openSettings(){
  $('modal').innerHTML=`<div class="mwrap" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal">
      <h3>⚙️ Réglages</h3>
      <div class="mrow"><div><div class="t">Sons</div><div class="d">Effets sonores de jeu</div></div>
        <div class="tgl ${S.settings.sound?'on':''}" onclick="UI.toggle('sound')"></div></div>
      <div class="mrow"><div><div class="t">Vibrations</div><div class="d">Retour haptique (mobile)</div></div>
        <div class="tgl ${S.settings.vibe?'on':''}" onclick="UI.toggle('vibe')"></div></div>
      <div class="mrow"><div><div class="t">Nouveautés</div><div class="d">Revoir les fonctionnalités récentes</div></div>
        <button class="btn btn-s" style="padding:9px 14px;font-size:12px" onclick="UI.closeModal();UI.whatsNew()">✨ Voir</button></div>
      <div class="mrow"><div><div class="t">Version</div><div class="d">CroupierMental</div></div>
        <span class="mono" style="font-size:13px;color:var(--text2)">v${APP_VER}</span></div>
      <div class="mrow"><div><div class="t">Données</div><div class="d">Stockées localement sur cet appareil</div></div>
        <button class="btn btn-s" style="padding:9px 14px;font-size:12px" onclick="UI.resetAll()">Réinitialiser</button></div>
      <button class="btn btn-p btn-w" style="margin-top:14px" onclick="UI.closeModal()">Fermer</button>
    </div>
  </div>`;
}

/* ---------- Nouveautés : affiché une fois par version ---------- */
const WHATS_NEW=[
  {ic:'🧭',t:'Voisins',d:'Cite un numéro et ses voisins dans l’ordre croissant, case par case',go:'voisins'},
  {ic:'🧠',t:'Remplir le cylindre',d:'Reconstitue la roue de tête, jusqu’aux 37 cases',go:'wheelfill'},
  {ic:'💰',t:'Paiements réglables',d:'Choisis les paris : plein, cheval, carré…',go:'paiements'},
  {ic:'🪙',t:'Change euros ↔ jetons',d:'Valeurs de jetons au choix (5, 10, 20, 50, 100…)',go:'chips'},
  {ic:'📣',t:'Annonces',d:'Tiers, Orphelins, Voisins du zéro, Jeu zéro',go:'annonces'},
  {ic:'📚',t:'Fiches de révision',d:'Cylindre dessiné, annonces détaillées, figures',go:'learn'}
];
function showWhatsNew(){
  $('modal').innerHTML=`<div class="mwrap" onclick="if(event.target===this)UI.closeModal()">
    <div class="modal wn-modal">
      <h3>✨ Nouveautés · v${APP_VER}</h3>
      <div class="wn-list">
        ${WHATS_NEW.map(w=>`<button type="button" class="wn-item" onclick="UI.closeModal();${w.go==='learn'?"UI.learn('cylindre')":`UI.openSetup('${w.go}')`}">
          <span class="wi">${w.ic}</span>
          <span class="wt">${w.t}<span class="wd">${w.d}</span></span>
          <span class="wa">›</span>
        </button>`).join('')}
      </div>
      <button class="btn btn-p btn-w" style="margin-top:14px" onclick="UI.closeModal()">C’est parti !</button>
    </div>
  </div>`;
}
UI.whatsNew=showWhatsNew;

/* expose pour onclick inline */
window.UI=UI;window.endSession=endSession;

render('home');
if(S.seenVer!==APP_VER){
  S.seenVer=APP_VER;save();
  setTimeout(showWhatsNew,450);
}
</script>
</body>
</html>
