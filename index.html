<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croupier">
<title>CroupierMental v5 — Calcul mental pour croupiers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090c;--bg2:#0d1014;--card:#12161c;--card2:#181d25;
  --accent:#10b981;--accent2:#059669;--accent-soft:rgba(16,185,129,.12);
  --gold:#f5c451;--gold2:#d9a833;--purple:#a78bfa;--blue:#5eaaf7;--pink:#f472b6;--red:#f06464;
  --text:#f4f6f8;--text2:#9aa3af;--muted:#5b6470;--border:#222934;--border2:#323b48;
  --rad:18px;--rad-sm:12px;
  --c-roulette:#e75c5c;--c-blackjack:#10b981;--c-baccarat:#f5a623;--c-texas:#5eaaf7;
  --c-ultimate:#a78bfa;--c-chips:#f5c451;--c-tables:#34d399;--c-mix:#f472b6;
  --c-combos:#fb923c;--c-cylindre:#22d3ee;--c-annonces:#c084fc;
}
html,body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,monospace}
button{font-family:inherit;color:inherit}
/* ---------- ambiance ---------- */
.bg-felt{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 500px at 50% -10%,rgba(16,185,129,.10),transparent 65%),
  radial-gradient(700px 420px at 110% 110%,rgba(245,196,81,.06),transparent 60%),
  radial-gradient(500px 380px at -10% 65%,rgba(167,139,250,.05),transparent 60%)}
.bg-suits{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.04;font-size:120px;line-height:1}
.bg-suits span{position:absolute;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-130vh) rotate(60deg)}}
#app{position:relative;z-index:2;min-height:100dvh}
/* safe areas iPhone : encoche/Dynamic Island en haut, barre home en bas */
.wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}65%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes glowP{0%,100%{box-shadow:0 0 14px rgba(245,196,81,.18)}50%{box-shadow:0 0 26px rgba(245,196,81,.45)}}
@keyframes xpFly{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.15)}}
@keyframes confFall{0%{opacity:1;transform:translateY(-40px) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(740deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes caret{0%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes ringIn{from{stroke-dashoffset:283}to{}}
.fadeUp{animation:fadeUp .35s ease-out both}
/* ---------- header ---------- */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 0 16px;gap:8px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;flex:1 1 auto;overflow:hidden;min-height:44px}
.logo>div{min-width:0}
.logo-tx,.logo-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-ic{flex:0 0 auto}
.logo:active{transform:scale(.97)}
.logo-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(140deg,#0f3d2e,#10b981 130%);border:1px solid rgba(16,185,129,.45);box-shadow:0 4px 18px rgba(16,185,129,.25)}
.logo-tx{font-size:18px;font-weight:800;letter-spacing:-.3px}
.logo-tx b{background:linear-gradient(120deg,#34d399,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:-2px}
.hdr-r{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.chip-btn{display:flex;align-items:center;gap:7px;padding:7px 11px;min-height:44px;background:var(--card);border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:border-color .15s;font-size:12px;font-weight:700}
.chip-btn:active{transform:scale(.96)}
.chip-btn .ico{font-size:15px}
.chip-fire{color:var(--gold);border-color:rgba(245,196,81,.35);background:linear-gradient(135deg,rgba(245,196,81,.12),transparent)}
.gear{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:11px;cursor:pointer;font-size:16px}
.gear:active{transform:scale(.94)}
/* ---------- carrière ---------- */
.career{background:linear-gradient(150deg,var(--card),#101720 75%);border:1px solid var(--border);border-radius:var(--rad);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.career::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--purple))}
.career-top{display:flex;align-items:center;gap:13px}
.rank-ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.career-info{flex:1;min-width:0}
.career-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-tag{font-size:11px;font-weight:700;color:var(--blue);background:rgba(94,170,247,.14);border:1px solid rgba(94,170,247,.3);padding:1px 8px;border-radius:7px}
.career-sub{font-size:11.5px;color:var(--text2);margin-top:1px}
.career-xpnum{text-align:right}
.career-xpnum b{font-size:18px;color:var(--gold)}
.career-xpnum span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pbar{height:9px;background:var(--bg2);border-radius:5px;overflow:hidden;margin:13px 0 6px;position:relative}
.pbar>div{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#34d399);transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.pbar>div::after{content:'';position:absolute;right:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));animation:pulse 1.6s infinite}
.pbar-tx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.pbar-tx b{color:var(--text2)}
/* ---------- défis ---------- */
.sect-t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sect-t .aux{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text2);font-weight:600}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dch{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 8px 9px;min-height:96px;text-align:center;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.dch:active{transform:scale(.95)}
.dch.done{border-color:rgba(16,185,129,.5);background:linear-gradient(160deg,rgba(16,185,129,.13),transparent)}
.dch.done::after{content:'✓';position:absolute;top:-6px;right:-5px;width:18px;height:18px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#04140d}
.dch .ic{font-size:21px}
.dch .nm{font-size:10px;font-weight:700;margin-top:3px}
.dch .pg{height:4px;background:var(--bg2);border-radius:2px;margin-top:6px;overflow:hidden}
.dch .pg>div{height:100%;background:linear-gradient(90deg,var(--accent),#34d399);border-radius:2px}
.dch .ct{font-size:9px;color:var(--muted);margin-top:4px}
/* ---------- grilles jeux & modes ---------- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.gcard::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:var(--gc,transparent);opacity:.7}
.gcard:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.gcard:active{transform:scale(.97)}
.gcard .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:10px;background:color-mix(in srgb,var(--gc) 14%,transparent);border:1px solid color-mix(in srgb,var(--gc) 30%,transparent)}
@supports not (background:color-mix(in srgb,red 10%,blue)){.gcard .ic{background:var(--bg2);border:1px solid var(--border)}}
.gcard .nm{font-size:14.5px;font-weight:800}
.gcard .ds{font-size:10.5px;color:var(--text2);margin-top:2px;line-height:1.4}
.gcard .acc{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--bg2);color:var(--text2)}
.qmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qmode{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 8px;text-align:center;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.qmode:active{transform:scale(.95)}
.qmode .ic{font-size:22px}
.qmode .nm{font-size:11.5px;font-weight:700;margin-top:4px}
.qmode .sb{font-size:9px;color:var(--muted)}
.qmode .bdg{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#231a02}
/* ---------- setup ---------- */
/* cible tactile ≥ 44px (recommandation Apple) */
.back{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:12px 14px 12px 0;margin-bottom:2px;min-height:44px}
.back:hover{color:var(--text2)}
.setup-head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.setup-head .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--gc,#10b981) 15%,transparent);border:1px solid color-mix(in srgb,var(--gc,#10b981) 35%,transparent)}
.setup-head h2{font-size:19px;font-weight:800}
.setup-head p{font-size:12px;color:var(--text2)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px}
.panel-t{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:11px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:58px;padding:11px 6px;min-height:46px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.seg button .s{display:block;font-size:8.5px;color:var(--muted);font-weight:600;margin-top:1px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#04140d}
.seg button.on .s{color:rgba(4,20,13,.7)}
.seg button:active{transform:scale(.96)}
.infrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;padding:11px;background:var(--bg2);border-radius:11px}
.infrow div{text-align:center;font-size:9px;color:var(--text2)}
.infrow b{display:block;font-size:13px;margin-top:2px;font-family:'JetBrains Mono',monospace}
.infrow b.g{color:var(--gold)}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tbtn{padding:13px 4px;min-height:46px;background:var(--bg2);border:1px solid var(--border);border-radius:11px;cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;transition:all .15s}
.tbtn:active{transform:scale(.93)}
.tbtn.ess{color:var(--gold);border-color:rgba(245,196,81,.3)}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbtn.ess.on{background:rgba(245,196,81,.15);border-color:var(--gold);color:var(--gold)}
/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;border:none;transition:all .15s;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:linear-gradient(135deg,#26cf96,var(--accent2));color:#04140d;box-shadow:0 6px 20px rgba(16,185,129,.3)}
.btn-s{background:var(--card);border:1px solid var(--border2);color:var(--text)}
.btn-w{width:100%}
/* ---------- jeu ---------- */
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.gstats{display:flex;gap:6px}
.gstat{min-width:50px;text-align:center;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:11px}
.gstat b{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;display:block;line-height:1.15}
.gstat span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gstat.ok b{color:var(--accent)}.gstat.er b{color:var(--red)}.gstat.tm b{color:var(--gold)}
.gstat.cb{border-color:rgba(245,196,81,.5);animation:glowP 1.4s infinite}.gstat.cb b{color:var(--gold)}
.lives{display:flex;gap:3px;align-items:center;padding:0 4px}
.lives span{font-size:15px;filter:grayscale(1) opacity(.25);transition:filter .2s}
.lives span.on{filter:none}
.tbar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.tbar>div{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#34d399);transition:width .1s linear}
.tbar>div.w{background:linear-gradient(90deg,var(--gold),#fcd97a)}
.tbar>div.d{background:linear-gradient(90deg,var(--red),#f79a9a)}
.qcard{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:20px;padding:24px 18px 20px;text-align:center;margin-bottom:12px;position:relative;transition:border-color .2s,box-shadow .2s;overflow:hidden}
.qcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent 4%,var(--gc,var(--accent)) 50%,transparent 96%);opacity:.55}
.qcard.ok{border-color:rgba(16,185,129,.6);box-shadow:0 0 24px rgba(16,185,129,.18)}
.qcard.ko{border-color:rgba(240,100,100,.6);animation:shake .4s}
.qcard .suit{position:absolute;right:-12px;bottom:-22px;font-size:96px;opacity:.05;pointer-events:none}
.qbadge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:14px}
.qtext{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;line-height:1.4;letter-spacing:-.5px;min-height:38px}
.qtext.long{font-size:20px}
.qhint{font-size:11px;color:var(--muted);margin-top:9px;min-height:14px}
.ansbox{display:flex;align-items:center;justify-content:center;min-height:64px;background:var(--bg);border:2px solid var(--border);border-radius:14px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;transition:all .15s;position:relative}
.ansbox.ok{border-color:var(--accent);background:rgba(16,185,129,.08)}
.ansbox.ko{border-color:var(--red);background:rgba(240,100,100,.08)}
.ansbox .ph{color:var(--muted);font-size:22px;font-weight:600}
.ansbox .crt{display:inline-block;width:3px;height:30px;background:var(--accent);margin-left:4px;border-radius:2px;animation:caret 1.1s infinite}
.fbk-slot{min-height:52px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:center}
.fbk{text-align:center;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14.5px;animation:pop .25s ease-out}
.fbk.ok{background:rgba(16,185,129,.13);color:#3ddfa4;border:1px solid rgba(16,185,129,.3)}
.fbk.ko{background:rgba(240,100,100,.12);color:var(--red);border:1px solid rgba(240,100,100,.3)}
.fbk .big{font-family:'JetBrains Mono',monospace;font-size:17px}
.fbk .tip{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-top:3px}
/* clavier */
.kpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;user-select:none}
.kpad button{padding:0;height:56px;background:var(--card);border:1px solid var(--border);border-radius:13px;font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;cursor:pointer;transition:background .1s,transform .1s}
.kpad button:active{transform:scale(.94);background:var(--card2)}
.kpad .fn{font-size:17px;color:var(--text2);background:var(--bg2)}
.kpad .zero{grid-column:span 2}
.kpad .go{grid-column:span 4;height:54px;background:linear-gradient(135deg,#26cf96,var(--accent2));border:none;color:#04140d;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;letter-spacing:.3px;box-shadow:0 5px 16px rgba(16,185,129,.25)}
.kpad .go:disabled{opacity:.45}
.xpfly{position:fixed;top:34%;left:50%;font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:800;color:var(--gold);filter:drop-shadow(0 0 14px rgba(245,196,81,.6));pointer-events:none;z-index:300;animation:xpFly .85s ease-out forwards}
.combo-pop{position:fixed;top:42%;right:14px;text-align:center;pointer-events:none;z-index:120;animation:pop .3s ease-out}
.combo-pop b{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:800;background:linear-gradient(135deg,#fde68a,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(245,196,81,.5))}
.combo-pop span{display:block;font-size:9px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1.4px}
/* ---------- résultats ---------- */
.rcard{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:22px;padding:26px 20px;text-align:center;animation:pop .4s ease-out}
.grade-wrap{position:relative;width:108px;height:108px;margin:0 auto 12px}
.grade-wrap svg{transform:rotate(-90deg)}
.grade-wrap .gl{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800;font-family:'JetBrains Mono',monospace}
.rtitle{font-size:21px;font-weight:800}
.rsub{font-size:13px;color:var(--text2);margin:3px 0 18px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.rstat{background:var(--bg2);border-radius:13px;padding:14px 8px}
.rstat b{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:800;display:block}
.rstat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.rxp{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,rgba(245,196,81,.14),rgba(245,196,81,.04));border:1px solid rgba(245,196,81,.3);border-radius:12px;padding:13px;margin-bottom:10px}
.rxp b{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--gold)}
.rxp span{font-size:11px;color:var(--text2)}
.rrec{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:12px;animation:pulse 1.6s infinite}
.ract{display:flex;gap:10px;margin-top:6px}
.ract .btn{flex:1}
/* ---------- stats ---------- */
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stcard{background:var(--bg2);border-radius:12px;padding:13px 8px;text-align:center}
.stcard b{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:800;display:block}
.stcard span{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stcard b.g{color:var(--accent)}.stcard b.y{color:var(--gold)}.stcard b.b{color:var(--blue)}.stcard b.p{color:var(--purple)}

};
const LVL={facile:1,normal:2,avance:3,difficile:4,expert:5};

/* 1.5 = paiement Blackjack 3:2 · 2,5,8,11,17,35 = barèmes roulette */
const ESS_TABLES=[1.5,2,5,8,11,17,35];

/* ---------- barèmes croupier ---------- */
/*GEN-START*/
const ROUL=[{n:'Plein',r:35},{n:'Cheval',r:17},{n:'Transversale',r:11},{n:'Carré',r:8},{n:'Sixain',r:5},{n:'Douzaine',r:2},{n:'Chance simple',r:1}];

const ANNONCES=[
  {id:'vz',n:'Voisins du zéro',short:'Voisins du 0',p:9,alias:'Grande série · série 0/2/3',
   bets:[{t:'transversale',nums:[0,2,3],c:2,r:11},{t:'cheval',nums:[4,7],c:1,r:17},
         {t:'cheval',nums:[12,15],c:1,r:17},{t:'cheval',nums:[18,21],c:1,r:17},
         {t:'cheval',nums:[19,22],c:1,r:17},{t:'carré',nums:[25,26,28,29],c:2,r:8},
         {t:'cheval',nums:[32,35],c:1,r:17}]},
  {id:'tiers',n:'Tiers du cylindre',short:'Tiers',p:6,alias:'Petite série · série 5/8',
   bets:[{t:'cheval',nums:[5,8],c:1,r:17},{t:'cheval',nums:[10,11],c:1,r:17},
         {t:'cheval',nums:[13,16],c:1,r:17},{t:'cheval',nums:[23,24],c:1,r:17},
         {t:'cheval',nums:[27,30],c:1,r:17},{t:'cheval',nums:[33,36],c:1,r:17}]},
  {id:'orph',n:'Orphelins',short:'Orphelins',p:5,alias:'Les 8 numéros restants',
   bets:[{t:'plein',nums:[1],c:1,r:35},{t:'cheval',nums:[6,9],c:1,r:17},
         {t:'cheval',nums:[14,17],c:1,r:17},{t:'cheval',nums:[17,20],c:1,r:17},
         {t:'cheval',nums:[31,34],c:1,r:17}]},
  {id:'jz',n:'Jeu zéro',short:'Jeu 0',p:4,alias:'Zéro spiel · le plus resserré',
   bets:[{t:'cheval',nums:[0,3],c:1,r:17},{t:'cheval',nums:[12,15],c:1,r:17},
         {t:'plein',nums:[26],c:1,r:35},{t:'cheval',nums:[32,35],c:1,r:17}]}
];
const annNums=a=>[...new Set(a.bets.flatMap(b=>b.nums))].sort((x,y)=>x-y);
/* Voisins du zéro + Tiers + Orphelins découpent le cylindre en 3 zones exclusives
   (17 + 12 + 8 = 37). Le Jeu zéro est inclus dans les Voisins du zéro : on ne
   l'utilise donc jamais comme réponse d'appartenance, ce serait ambigu. */
const ZONES=['vz','tiers','orph'].map(id=>ANNONCES.find(a=>a.id===id));
const zoneOf=n=>ZONES.find(a=>annNums(a).includes(n));
/* gain (hors mise) si le numéro sort, pour 1 unité par pièce */
const annPay=(a,n)=>sum(a.bets.filter(b=>b.nums.includes(n)).map(b=>b.c*b.r));
const annBetsOn=(a,n)=>a.bets.filter(b=>b.nums.includes(n));
/* Finales en plein : tous les numéros se terminant par le même chiffre */
const FINALES=Array.from({length:10},(_,d)=>{
  const nums=[];for(let n=d===0?0:d;n<=36;n+=10)nums.push(n);
  return {d,nums,p:nums.length};
});
const PPAIRS=[{n:'Paire mixte',r:6},{n:'Paire colorée',r:12},{n:'Paire parfaite',r:25}];
const TRIPS=[{n:'Quinte Flush Royale',r:50},{n:'Quinte Flush',r:40},{n:'Carré',r:30},{n:'Full',r:8},{n:'Couleur',r:6},{n:'Suite',r:5},{n:'Brelan',r:3}];
const BLIND=[{n:'Quinte Flush Royale',r:500},{n:'Quinte Flush',r:50},{n:'Carré',r:10},{n:'Full',r:3},{n:'Suite',r:1}];
/* 25% de chance de tirer une question du niveau inférieur : variété + réalisme
   (un croupier expert paie aussi des coups simples) */
const effL=L=>(L>1&&Math.random()<0.25)?L-1:L;

/* --- Figures de paiement (picture bets) ---
   Un numéro plein appartient à : 1 plein, jusqu’à 4 chevaux, 1 transversale,
   jusqu’à 4 carrés, 2 sixains. Les pièces peuvent être empilées. */
const INSIDE=[{n:'plein',r:35,max:4},{n:'cheval',r:17,max:6},{n:'transversale',r:11,max:3},{n:'carré',r:8,max:4},{n:'sixain',r:5,max:3}];
const FIGURES=[
  {n:'Plein + cheval',parts:[[1,35],[1,17]]},
  {n:'Plein + 2 chevaux',parts:[[1,35],[2,17]]},
  {n:'Carré + cheval',parts:[[1,8],[1,17]]},
  {n:'2 carrés',parts:[[2,8]]},
  {n:'Transversale + plein',parts:[[1,11],[1,35]]},
  {n:'Numéro et les chevaux',parts:[[1,35],[4,17]]},
  {n:'Complet (plein + chevaux + carrés)',parts:[[1,35],[4,17],[4,8]]}
];
const figVal=f=>sum(f.parts.map(p=>p[0]*p[1]));
const PLU={cheval:'chevaux'};
const plu=(c,n)=>c>1?(PLU[n]||n+'s'):n;
const mkPicture=(nTypes,maxP)=>pickN(INSIDE,nTypes).map(t=>[rnd(1,Math.min(t.max,maxP)),t.r,t.n]).sort((a,b)=>b[1]-a[1]);
const pictureQ=(parts,denom)=>{
  const pieces=sum(parts.map(p=>p[0]*p[1]));
  const txt=parts.map(p=>`${p[0]} ${plu(p[0],p[2])}`).join(' + ');
  const rates=parts.map(p=>`${p[2]} = ${p[1]}`).join(' · ');
  if(denom)return {game:'roulette',ctx:`Figure · pièces de ${denom}`,q:txt,ans:pieces*denom,hint:`${rates} → total × ${denom}`,parts,denom};
  return {game:'roulette',ctx:'Figure · paiement en pièces',q:txt,ans:pieces,hint:rates,parts};
};

function genRoulette(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  // pondération réaliste : pleins et chevaux tombent bien plus souvent en salle
  const wp=()=>ROUL[pick([0,0,0,1,1,1,2,3,4,5,6])];
  if(L===1){
    const p=wp(),b=bet();
    return {game:'roulette',ctx:'Paiement · '+p.n,q:`${b} × ${p.r}`,ans:b*p.r,hint:`${p.n} = ${p.r} pour 1`};
  }
  if(L===2){
    const t=pick(['mc','fig','two']);
    if(t==='mc'){const p=wp(),b=bet();
      return {game:'roulette',ctx:'Mise comprise · '+p.n,q:`${b} × ${p.r+1}`,ans:b*(p.r+1),hint:'Gain + mise rendue'};}
    if(t==='fig')return pictureQ(mkPicture(2,2));
    const [p1,p2]=pick2(ROUL),b1=bet(),b2=bet();
    return {game:'roulette',ctx:'2 paris gagnants',q:`(${b1}×${p1.r}) + (${b2}×${p2.r})`,ans:b1*p1.r+b2*p2.r,hint:`${p1.n} + ${p2.n}`};
  }
  if(L===3){
    const t=pick(['pic','pic','ann','three']);
    if(t==='pic')return pictureQ(mkPicture(rnd(2,3),4));
    if(t==='ann'){const a=pick(ANNONCES),k=rnd(2,6);
      return {game:'roulette',ctx:'Annonce · mise totale',q:`${a.n} par ${k}`,ans:a.p*k,hint:`${a.n} = ${a.p} pièces`,ann:a.id};}
    const ps=pickN(ROUL,3),bs=ps.map(()=>bet());
    return {game:'roulette',ctx:'3 paris gagnants',q:bs.map((b,i)=>`(${b}×${ps[i].r})`).join(' + '),ans:sum(bs.map((b,i)=>b*ps[i].r)),hint:ps.map(p=>p.n).join(' + ')};
  }
  if(L===4){
    const t=pick(['fig','picd','annd','threeMC']);
    if(t==='fig'){const f=pick(FIGURES),k=rnd(1,4);
      return {game:'roulette',ctx:'Figure classique'+(k>1?' · empilée':''),q:k>1?`${f.n} × ${k}`:f.n,ans:figVal(f)*k,
        hint:f.parts.map(p=>`${p[0]}×${p[1]}`).join(' + ')+(k>1?` , le tout × ${k}`:''),parts:f.parts.map(p=>[p[0]*k,p[1]])};}
    if(t==='picd')return pictureQ(mkPicture(2,4),pick([5,10,25]));
    if(t==='annd'){const a=pick(ANNONCES),k=rnd(2,5),v=pick([5,10,25]);
      return {game:'roulette',ctx:'Annonce · '+a.n,q:`${a.n} par ${k} pièces de ${v}`,ans:a.p*k*v,hint:`${a.n} = ${a.p} pièces → en espèces ?`,ann:a.id};}
    const ps=pickN(ROUL,3),bs=ps.map(()=>bet());
    return {game:'roulette',ctx:'3 paris · mises comprises',q:bs.map((b,i)=>`(${b}×${ps[i].r+1})`).join(' + '),ans:sum(bs.map((b,i)=>b*(ps[i].r+1))),hint:ps.map(p=>p.n).join(' + ')};
  }
  const t=pick(['rush','picBig','figd']);
  if(t==='picBig')return pictureQ(mkPicture(rnd(3,4),6));
  if(t==='figd'){const f=pick(FIGURES.slice(4)),k=rnd(2,4),v=pick([5,10,25]);
    return {game:'roulette',ctx:`Figure · pièces de ${v}`,q:`${f.n} × ${k}`,ans:figVal(f)*k*v,
      hint:`${f.n} = ${figVal(f)} pièces → × ${k} × ${v}`,parts:f.parts.map(p=>[p[0]*k,p[1]]),denom:v};}
  const ps=pickN(ROUL,4),bs=ps.map(()=>bet());
  return {game:'roulette',ctx:'Rush · 4 paris',q:bs.map((b,i)=>`(${b}×${ps[i].r})`).join(' + '),ans:sum(bs.map((b,i)=>b*ps[i].r)),hint:ps.map(p=>p.n).join(' + ')};
}

function genBlackjack(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  const evens=B.filter(b=>b%2===0);
  const evenBet=()=>pick(evens.length?evens:[10,20,50,100]);
  if(L===1){
    const t=pick(['count','bj','pay']);
    if(t==='count'){const cards=Array.from({length:rnd(2,3)},()=>rnd(2,11));
      return {game:'blackjack',ctx:'Comptage de main',q:cards.join(' + '),ans:sum(cards),hint:`${cards.length} cartes`};}
    if(t==='bj'){const b=evenBet();
      return {game:'blackjack',ctx:'Blackjack · 3:2',q:`${b} × 1.5`,ans:b*1.5,hint:'La mise + sa moitié'};}
    const b=bet();
    return {game:'blackjack',ctx:'Box gagnante · 1:1',q:`${b} × 1`,ans:b,hint:'Payé une fois la mise'};
  }
  if(L===2){
    const t=pick(['bj','ins','count']);
    if(t==='bj'){const b=evenBet();
      return {game:'blackjack',ctx:'Blackjack · 3:2',q:`${b} × 1.5`,ans:b*1.5,hint:'La mise + sa moitié'};}
    if(t==='ins'){const b=evenBet();
      return {game:'blackjack',ctx:'Assurance · coût',q:`${b} ÷ 2`,ans:b/2,hint:'Assurance = moitié de la mise'};}
    const cards=Array.from({length:4},()=>rnd(2,11));
    return {game:'blackjack',ctx:'Comptage de main',q:cards.join(' + '),ans:sum(cards),hint:'4 cartes'};
  }
  if(L===3){
    const t=pick(['bj','boxes','count5']);
    if(t==='bj'){const b=bet(),a=b*1.5;
      return {game:'blackjack',ctx:'Blackjack · 3:2',q:`${b} × 1.5`,ans:a,dec:a%1!==0,hint:a%1!==0?'Réponse avec virgule':'La mise + sa moitié'};}
    if(t==='boxes'){const b1=evenBet(),b2=bet();
      return {game:'blackjack',ctx:'2 boxes gagnantes',q:`(${b1}×1.5) + (${b2}×1)`,ans:b1*1.5+b2,hint:'Blackjack + gagne simple'};}
    const cards=Array.from({length:5},()=>rnd(2,10));
    return {game:'blackjack',ctx:'Comptage de main',q:cards.join(' + '),ans:sum(cards),hint:'5 cartes'};
  }
  if(L===4){
    const t=pick(['pp','boxes3','insWin']);
    if(t==='pp'){const p=pick(PPAIRS),b=pick(B.filter(x=>x<=50));
      return {game:'blackjack',ctx:'Perfect Pairs · '+p.n,q:`${b} × ${p.r}`,ans:b*p.r,hint:`${p.n} payée ${p.r}:1`};}
    if(t==='insWin'){const b=evenBet();
      return {game:'blackjack',ctx:'Assurance gagnante · 2:1',q:`${b} × 2`,ans:b*2,hint:'Assurance payée 2 pour 1'};}
    const b1=evenBet(),b2=bet(),b3=bet();
    return {game:'blackjack',ctx:'3 boxes',q:`(${b1}×1.5) + ${b2} + (${b3}×2)`,ans:b1*1.5+b2+b3*2,hint:'BJ + gagne + double gagnant'};
  }
  if(coin()){
    const b=bet(),s=pick(B.filter(x=>x<=50)),p=pick(PPAIRS),a=b*1.5+s*p.r;
    return {game:'blackjack',ctx:'BJ + side bet',q:`(${b}×1.5) + (${s}×${p.r})`,ans:a,dec:a%1!==0,hint:`Blackjack 3:2 + ${p.n}`};
  }
  const b1=evenBet(),b2=bet(),b3=bet(),b4=evenBet();
  return {game:'blackjack',ctx:'4 boxes',q:`(${b1}×1.5) + (${b2}×2) + ${b3} + (${b4}×1.5)`,ans:b1*1.5+b2*2+b3+b4*1.5,hint:'BJ + double + gagne + BJ'};
}

function genBaccarat(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  const maxB=Math.max(...B);
  const c20s=[20,40,60,80,100,120,140,160,180,200,240,300].filter(x=>x<=Math.max(100,maxB));
  const b20=()=>pick(c20s);
  if(L===1){
    if(coin()){const b=bet();
      return {game:'baccarat',ctx:'Joueur gagne · 1:1',q:`${b} × 1`,ans:b,hint:'Payé une fois la mise'};}
    const b=pick(B.filter(x=>x<=100));
    return {game:'baccarat',ctx:'Égalité · 8:1',q:`${b} × 8`,ans:b*8,hint:'Tie payé 8 pour 1'};
  }
  if(L===2){
    if(coin()){const b=b20();
      return {game:'baccarat',ctx:'Banque gagne · commission 5%',q:`${b} × 0.95`,ans:round2(b*0.95),hint:'Payé 19 pour 20'};}
    const b=pick(B.filter(x=>x<=100));
    return {game:'baccarat',ctx:'Égalité · 8:1',q:`${b} × 8`,ans:b*8,hint:'Tie payé 8 pour 1'};
  }
  if(L===3){
    const t=pick(['pair','comm','bank']);
    if(t==='pair'){const b=pick(B.filter(x=>x<=100));
      return {game:'baccarat',ctx:'Paire Joueur/Banque · 11:1',q:`${b} × 11`,ans:b*11,hint:'Paire payée 11 pour 1'};}
    if(t==='comm'){const b=b20();
      return {game:'baccarat',ctx:'Commission à prélever',q:`5% de ${b}`,ans:round2(b*0.05),hint:'Commission banque = 5%'};}
    const b=b20();
    return {game:'baccarat',ctx:'Banque gagne · commission 5%',q:`${b} × 0.95`,ans:round2(b*0.95),hint:'Payé 19 pour 20'};
  }
  if(L===4){
    const b1=b20(),b2=bet();
    return {game:'baccarat',ctx:'2 mains · Banque + Joueur',q:`(${b1}×0.95) + (${b2}×1)`,ans:round2(b1*0.95+b2),hint:'Banque avec commission'};
  }
  if(coin()){
    const b1=b20(),b2=pick(B.filter(x=>x<=50));
    return {game:'baccarat',ctx:'Banque + Égalité',q:`(${b1}×0.95) + (${b2}×8)`,ans:round2(b1*0.95+b2*8),hint:'Commission 5% + Tie 8:1'};
  }
  const b1=b20(),b2=bet(),b3=pick(B.filter(x=>x<=50));
  return {game:'baccarat',ctx:'Table complète',q:`(${b1}×0.95) + ${b2} + (${b3}×11)`,ans:round2(b1*0.95+b2+b3*11),hint:'Banque + Joueur + Paire'};
}

function genTexas(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  const pots20=[120,140,160,180,200,220,240,260,280,300,320,340,360,400,420,440,460,480,500,540,560,600,640,700,720,800];
  if(L===1){
    const a=Array.from({length:rnd(2,3)},()=>bet());
    return {game:'texas',ctx:'Calcul du pot',q:a.join(' + '),ans:sum(a),hint:`${a.length} joueurs misent`};
  }
  if(L===2){
    if(coin()){const b=bet(),n=rnd(3,6);
      return {game:'texas',ctx:'Mise collective',q:`${b} × ${n}`,ans:b*n,hint:`${n} joueurs payent ${b}`};}
    const a=Array.from({length:4},()=>bet());
    return {game:'texas',ctx:'Calcul du pot',q:a.join(' + '),ans:sum(a),hint:'4 joueurs misent'};
  }
  if(L===3){
    const t=pick(['rake','raise','sideM','sideE']);
    if(t==='rake'){const p=pick(pots20);
      return {game:'texas',ctx:'Rake · 5%',q:`5% de ${p}`,ans:round2(p*0.05),hint:'Prélèvement maison'};}
    if(t==='raise'){const b=bet(),n=rnd(2,4),extra=bet();
      return {game:'texas',ctx:'Pot + relance',q:`(${b}×${n}) + ${extra}`,ans:b*n+extra,hint:`${n} calls + 1 relance`};}
    const a=pick([20,25,30,40,50,60,75,100]),top=a+pick([20,25,40,50,75,100]),k=rnd(2,3);
    if(t==='sideM')
      return {game:'texas',ctx:'All-in · pot principal',q:`${a} × ${k+1}`,ans:a*(k+1),hint:`All-in à ${a}, suivi par ${k} joueurs → le principal prend ${a} de chacun`};
    return {game:'texas',ctx:'Pot extérieur (side pot)',q:`(${top} − ${a}) × ${k}`,ans:(top-a)*k,hint:`All-in à ${a} · ${k} joueurs misent ${top} → l’excédent va au pot extérieur`};
  }
  if(L===4){
    const t=pick(['side','sideFull','rake']);
    if(t==='side'){const main=pick([150,200,250,300,350,400,450,500]),s=bet(),k=rnd(2,3);
      return {game:'texas',ctx:'Pot principal + side pot',q:`${main} + (${s}×${k})`,ans:main+s*k,hint:`Side pot : ${k} joueurs`};}
    if(t==='sideFull'){const a=pick([25,40,50,60,75,100]),top=a+pick([25,50,75,100]),k=rnd(2,3);
      return {game:'texas',ctx:'All-in · principal + extérieur',q:`(${a}×${k+1}) + ((${top}−${a})×${k})`,ans:a*(k+1)+(top-a)*k,hint:`All-in ${a} · ${k} joueurs à ${top}`};}
    const p=pick(pots20);
    return {game:'texas',ctx:'Rake · 5%',q:`5% de ${p}`,ans:round2(p*0.05),hint:'Prélèvement maison'};
  }
  const t=pick(['multi','net','doubleAllin']);
  if(t==='multi'){const main=pick([400,500,600]),s1=bet()*rnd(2,3),s2=bet()*rnd(2,3);
    return {game:'texas',ctx:'Multi-pots',q:`${main} + ${s1} + ${s2}`,ans:main+s1+s2,hint:'Principal + 2 side pots'};}
  if(t==='doubleAllin'){const a1=pick([20,25,30,40,50]),a2=a1+pick([20,25,50]),top=a2+pick([25,50,75]);
    return {game:'texas',ctx:'Double all-in · 3 pots',q:`(${a1}×3) + ((${a2}−${a1})×2) + (${top}−${a2})`,
      ans:a1*3+(a2-a1)*2+(top-a2),hint:`All-ins à ${a1} et ${a2}, 3e joueur couvre à ${top}`};}
  const p=pick(pots20);
  return {game:'texas',ctx:'Pot net après rake 5%',q:`${p} − 5%`,ans:round2(p*0.95),hint:`Rake = ${fmtN(p*0.05)}`};
}

function genUltimate(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  const evens=B.filter(b=>b%2===0);
  if(L===1){
    if(coin()){const a=bet();
      return {game:'ultimate',ctx:'Ante + Blind',q:`${a} × 2`,ans:a*2,hint:'Ante = Blind'};}
    const b=bet();
    return {game:'ultimate',ctx:'Blind · Suite 1:1',q:`${b} × 1`,ans:b,hint:'Suite payée 1 pour 1'};
  }
  if(L===2){
    const t=pick(['play','total','trips']);
    if(t==='play'){const a=bet(),m=pick([3,4]);
      return {game:'ultimate',ctx:`Mise Play ${m}x`,q:`${a} × ${m}`,ans:a*m,hint:`Play = ${m} fois l’ante`};}
    if(t==='trips'){const b=pick(B.filter(x=>x<=50)),tr=pick(TRIPS.slice(4));
      return {game:'ultimate',ctx:'Trips · '+tr.n,q:`${b} × ${tr.r}`,ans:b*tr.r,hint:`${tr.n} payé ${tr.r}:1`};}
    const a=bet(),m=pick([2,3,4]);
    return {game:'ultimate',ctx:'Total engagé',q:`${a} + ${a} + (${a}×${m})`,ans:a*(2+m),hint:`Ante + Blind + Play ${m}x`};
  }
  if(L===3){
    if(coin()){const t=pick(TRIPS),b=pick(B.filter(x=>x<=50));
      return {game:'ultimate',ctx:'Trips · '+t.n,q:`${b} × ${t.r}`,ans:b*t.r,hint:`${t.n} payé ${t.r}:1`};}
    const a=bet(),m=pick([2,3,4]),n=rnd(2,3);
    return {game:'ultimate',ctx:`${n} joueurs · Play ${m}x`,q:`(${a}×${m}) × ${n}`,ans:a*m*n,hint:`${n} mains payées Play ${m}x`};
  }
  if(L===4){
    if(coin()){const h=pick(BLIND),b=h.r>=50?pick([5,10,15,25]):bet();
      return {game:'ultimate',ctx:'Blind · '+h.n,q:`${b} × ${h.r}`,ans:b*h.r,hint:`${h.n} payé ${h.r}:1`};}
    const b=pick(evens.length?evens:[10,20,50]);
    return {game:'ultimate',ctx:'Blind · Couleur 3:2',q:`${b} × 1.5`,ans:b*1.5,hint:'Couleur payée 3 pour 2'};
  }
  if(coin()){
    const a=bet(),m=pick([3,4]),h=pick(BLIND.filter(x=>x.r<=10));
    return {game:'ultimate',ctx:'Gain complet',q:`${a} + (${a}×${m}) + (${a}×${h.r})`,ans:a*(1+m+h.r),hint:`Ante + Play ${m}x + Blind ${h.n}`};
  }
  const a=bet(),m=pick([2,3,4]),s=pick(B.filter(x=>x<=50)),t=pick(TRIPS.slice(3));
  return {game:'ultimate',ctx:'Play + Trips',q:`(${a}×${m}) + (${s}×${t.r})`,ans:a*m+s*t.r,hint:`Play ${m}x + Trips ${t.n}`};
}

/* ---------------- CHANGE & JETONS (valeurs réglables) ---------------- */
const chipInfo=v=>CHIP_VALS.find(c=>c.v===v)||{v,n:'Jeton',c:'#9aa3af'};
function activeChips(opts){
  const vals=(opts&&opts.chips&&opts.chips.length)?[...opts.chips]:[...DEF_CHIPS];
  return vals.filter(v=>v>0).sort((a,b)=>a-b);
}
/* décomposition au moins de jetons possible, dans les valeurs disponibles.
   Calcul exact (programmation dynamique) : le glouton se trompe dès que 20 et
   25 sont actifs ensemble (40 € = 2×20, pas 25+10+5). rest≠0 si impossible. */
function fewestChips(amount,vals){
  const V=[...vals].sort((a,b)=>b-a);
  const best=new Array(amount+1).fill(Infinity),from=new Array(amount+1).fill(0);
  best[0]=0;
  for(let a=1;a<=amount;a++)for(const v of V)
    if(v<=a&&best[a-v]+1<best[a]){best[a]=best[a-v]+1;from[a]=v;}
  if(!isFinite(best[amount]))return {parts:[],rest:amount,count:0};
  const cnt={};for(let a=amount;a>0;a-=from[a])cnt[from[a]]=(cnt[from[a]]||0)+1;
  const parts=V.filter(v=>cnt[v]).map(v=>({v,n:cnt[v]}));
  return {parts,rest:0,count:best[amount]};
}
function genChips(d,opts){
  const L=effL(LVL[d]);
  const V=activeChips(opts);
  const v=()=>pick(V);
  const big=V[V.length-1],small=V[0];
  if(L===1){
    if(coin()){const c=v(),n=rnd(3,12);
      return {game:'chips',ctx:'Valeur d’une pile',q:`${n} jetons de ${c}`,ans:n*c,
        hint:`${n} × ${c}`,chipsView:[{v:c,n}]};}
    const c=v(),n=rnd(3,15);
    return {game:'chips',ctx:'Change · euros → jetons',q:`${n*c} € en jetons de ${c}`,ans:n,
      hint:`${n*c} ÷ ${c}`,chipsView:[{v:c,n:Math.min(n,12)}]};
  }
  if(L===2){
    const t=pick(['toChips','toEuro','two']);
    if(t==='toChips'){const c=v(),n=rnd(4,20);
      return {game:'chips',ctx:'Change · euros → jetons',q:`${n*c} € en jetons de ${c}`,ans:n,
        hint:`Combien de jetons ${chipInfo(c).n.toLowerCase()}s ?`,chipsView:[{v:c,n:Math.min(n,12)}]};}
    if(t==='toEuro'){const c=v(),n=rnd(4,20);
      return {game:'chips',ctx:'Valeur d’une pile',q:`${n} jetons de ${c}`,ans:n*c,hint:`${n} × ${c}`,chipsView:[{v:c,n:Math.min(n,12)}]};}
    const a={v:v(),n:rnd(2,8)},b={v:v(),n:rnd(2,6)};
    return {game:'chips',ctx:'Comptage de tapis',q:`(${a.n}×${a.v}) + (${b.n}×${b.v})`,ans:a.n*a.v+b.n*b.v,
      hint:'2 piles',chipsView:[a,b]};
  }
  if(L===3){
    const t=pick(['toChips','three','swap']);
    if(t==='toChips'){const c=v(),n=rnd(6,30);
      return {game:'chips',ctx:'Change · euros → jetons',q:`${n*c} € en jetons de ${c}`,ans:n,
        hint:`${n*c} ÷ ${c}`,chipsView:[{v:c,n:Math.min(n,12)}]};}
    if(t==='swap'){
      const others=V.length>1?V:null;   // l'échange n'a de sens qu'avec 2 valeurs différentes
      const a=v(),n=rnd(4,20),tot=n*a;
      const b=others?pick(others.filter(x=>x!==a)):null;
      if(b==null||tot%b!==0)
        return {game:'chips',ctx:'Valeur d’une pile',q:`${n} jetons de ${a}`,ans:tot,hint:`${n} × ${a}`,chipsView:[{v:a,n:Math.min(n,12)}]};
      return {game:'chips',ctx:'Échange de jetons',q:`${n} jetons de ${a} → en jetons de ${b}`,ans:tot/b,
        hint:`${n}×${a} = ${tot} €, puis ÷ ${b}`,chipsView:[{v:a,n:Math.min(n,10)}]};}
    const ps=pickN(V,Math.min(3,V.length)).map(x=>({v:x,n:rnd(2,8)}));
    return {game:'chips',ctx:'Comptage de tapis',q:ps.map(p=>`(${p.n}×${p.v})`).join(' + '),
      ans:sum(ps.map(p=>p.n*p.v)),hint:`${ps.length} piles`,chipsView:ps};
  }
  if(L===4){
    const t=pick(['rendu','minChips','toChips','stack']);
    if(t==='rendu'){const c=v(),given=c*rnd(10,40),spent=c*rnd(2,8);
      return {game:'chips',ctx:'Rendu client',q:`${given} € − ${spent} € à rendre en jetons de ${c}`,
        ans:(given-spent)/c,hint:`Reste ${given-spent} €, ÷ ${c}`};}
    if(t==='minChips'){const amt=small*rnd(6,60);
      const g=fewestChips(amt,V);
      if(g.rest!==0)return {game:'chips',ctx:'Change · euros → jetons',q:`${amt} € en jetons de ${small}`,ans:amt/small,hint:`${amt} ÷ ${small}`};
      return {game:'chips',ctx:'Le moins de jetons possible',q:`${amt} € — combien de jetons au minimum ?`,
        ans:g.count,hint:g.parts.map(p=>`${p.n}×${p.v}`).join(' + '),chipsView:g.parts};}
    if(t==='toChips'){const c=v(),n=rnd(8,40);
      return {game:'chips',ctx:'Change · euros → jetons',q:`${n*c} € en jetons de ${c}`,ans:n,hint:`${n*c} ÷ ${c}`};}
    const ps=pickN(V,Math.min(4,V.length)).map(x=>({v:x,n:rnd(2,10)}));
    return {game:'chips',ctx:'Stack complet',q:ps.map(p=>`(${p.n}×${p.v})`).join(' + '),
      ans:sum(ps.map(p=>p.n*p.v)),hint:`${ps.length} valeurs`,chipsView:ps};
  }
  const t=pick(['minChips','mixChange','stack','rendu']);
  if(t==='minChips'){const amt=small*rnd(10,120),g=fewestChips(amt,V);
    if(g.rest!==0)return {game:'chips',ctx:'Change · euros → jetons',q:`${amt} € en jetons de ${small}`,ans:amt/small,hint:`${amt} ÷ ${small}`};
    return {game:'chips',ctx:'Le moins de jetons possible',q:`${amt} € — combien de jetons au minimum ?`,
      ans:g.count,hint:g.parts.map(p=>`${p.n}×${p.v}`).join(' + '),chipsView:g.parts};}
  if(t==='mixChange'){const c=v(),other=V.length>1?pick(V.filter(x=>x!==c)):null;
    const nb=rnd(1,4),amt=c*rnd(10,40);
    const rest=other==null?-1:amt-nb*other;
    if(rest<=0||rest%c!==0)return {game:'chips',ctx:'Change · euros → jetons',q:`${amt} € en jetons de ${c}`,ans:amt/c,hint:`${amt} ÷ ${c}`};
    return {game:'chips',ctx:'Change mixte',q:`${amt} € : ${nb} jetons de ${other}, le reste en ${c}`,
      ans:rest/c,hint:`${amt} − ${nb*other} = ${rest}, ÷ ${c}`};}
  if(t==='rendu'){const c=v(),given=c*rnd(20,60),spent=c*rnd(3,15);
    return {game:'chips',ctx:'Rendu client',q:`${given} € − ${spent} € à rendre en jetons de ${c}`,
      ans:(given-spent)/c,hint:`Reste ${given-spent} €, ÷ ${c}`};}
  const ps=V.map(x=>({v:x,n:rnd(1,12)}));
  return {game:'chips',ctx:'Gros stack',q:ps.map(p=>`(${p.n}×${p.v})`).join(' + '),
    ans:sum(ps.map(p=>p.n*p.v)),hint:'Comptage complet',chipsView:ps};
}

/* --- Tables : couverture garantie de ×1 à ×20 ---
   Un tirage aléatoire simple laisse des trous ; on parcourt donc un sac
   mélangé de tous les multiplicateurs 1→20 avant d'en réutiliser un. */
let multBag=[];
const nextMult=(max)=>{
  const pool=multBag.filter(m=>m<=max);
  if(!pool.length){multBag=pickN(Array.from({length:MULT_MAX},(_,i)=>i+1),MULT_MAX);return nextMult(max);}
  const m=pool[0];multBag=multBag.filter(x=>x!==m);return m;
};
const tLabel=t=>t===1.5?'1,5':String(t);
function genTables(d,tables){
  const L=effL(LVL[d]),tmax=Math.min(DIFFS[d].tmax,MULT_MAX);
  const T=(tables&&tables.length)?tables:ESS_TABLES;
  if(L<=2){
    const t=pick(T),m=nextMult(tmax);
    const bj=t===1.5;
    return {game:'tables',ctx:bj?'Table de 1,5 · paiement Blackjack':'Multiplication',
      q:`${tLabel(t)} × ${m}`,ans:t*m,table:t,
      hint:bj?`Mise ${m} payée 3:2 → ${m} + la moitié`:`Table de ${tLabel(t)}`};
  }
  if(L<=4){
    const t1=pick(T),t2=pick(T),m1=nextMult(tmax),m2=nextMult(tmax);
    return {game:'tables',ctx:'Double calcul',q:`(${tLabel(t1)}×${m1}) + (${tLabel(t2)}×${m2})`,
      ans:t1*m1+t2*m2,table:t1,hint:''};
  }
  const t1=pick(T),t2=pick(T),t3=pick(T),m1=nextMult(tmax),m2=nextMult(tmax),m3=nextMult(Math.min(10,tmax));
  return {game:'tables',ctx:'Triple calcul',
    q:`(${tLabel(t1)}×${m1}) + (${tLabel(t2)}×${m2}) + (${tLabel(t3)}×${m3})`,
    ans:t1*m1+t2*m2+t3*m3,table:t1,hint:''};
}

/* ---------------- CYLINDRE : voisins sur la roue ---------------- */
const ordinal=k=>k===1?'1er':k+'e';
function genCylindre(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets;
  const n=pick(WHEEL);
  if(L===1){
    const side=coin()?1:-1;
    return {game:'cylindre',ctx:'Voisin immédiat',q:`Voisin ${side>0?'à droite':'à gauche'} du ${n} ?`,
      ans:neighborAt(n,side),hint:'Sens horaire = vers la droite',wheelFocus:[n],wheelHi:[neighborAt(n,side)]};
  }
  if(L===2){
    if(coin()){
      const k=rnd(2,3),side=coin()?1:-1;
      return {game:'cylindre',ctx:'Voisin éloigné',q:`${ordinal(k)} voisin ${side>0?'à droite':'à gauche'} du ${n} ?`,
        ans:neighborAt(n,side*k),hint:`Compte ${k} cases sur le cylindre`,wheelFocus:[n],wheelHi:[neighborAt(n,side*k)]};
    }
    const k=rnd(1,3);
    return {game:'cylindre',ctx:'Nombre de numéros',q:`Le ${n} et les ${k} voisins : combien de numéros ?`,
      ans:2*k+1,hint:`${k} de chaque côté + le numéro lui-même`,wheelFocus:neighbors(n,k)};
  }
  if(L===3){
    const k=rnd(1,3),u=pick(B);
    return {game:'cylindre',ctx:'Mise totale',q:`Le ${n} et les ${k} voisins par ${u}`,
      ans:(2*k+1)*u,hint:`${2*k+1} numéros en plein × ${u}`,wheelFocus:neighbors(n,k)};
  }
  if(L===4){
    if(coin()){
      const k=rnd(1,3),u=pick(B),hit=pick(neighbors(n,k));
      return {game:'cylindre',ctx:'Paiement · numéro couvert',q:`Le ${n} et les ${k} voisins par ${u} · le ${hit} sort`,
        ans:u*35,hint:`${hit} est couvert en plein → ${u} × 35`,wheelFocus:neighbors(n,k),wheelHi:[hit]};
    }
    return {game:'cylindre',ctx:'Numéro opposé',q:`Numéro en face du ${n} sur le cylindre ?`,
      ans:opposite(n),hint:'18 cases plus loin',wheelFocus:[n],wheelHi:[opposite(n)]};
  }
  const t=pick(['net','pay','opp']);
  const k=rnd(2,4),u=pick(B);
  if(t==='pay'){
    const hit=pick(neighbors(n,k));
    return {game:'cylindre',ctx:'Paiement net',q:`Le ${n} et les ${k} voisins par ${u} · le ${hit} sort · gain net ?`,
      ans:u*35-(2*k+1)*u,hint:`Gain ${u}×35 moins la mise totale de ${(2*k+1)*u}`,wheelFocus:neighbors(n,k),wheelHi:[hit]};
  }
  if(t==='opp'){
    const k2=rnd(1,2);
    return {game:'cylindre',ctx:'Opposé + voisin',q:`${ordinal(k2)} voisin à droite du numéro opposé au ${n} ?`,
      ans:neighborAt(opposite(n),k2),hint:`Opposé du ${n}, puis ${k2} case(s) à droite`,wheelFocus:[n],wheelHi:[neighborAt(opposite(n),k2)]};
  }
  return {game:'cylindre',ctx:'Mise totale',q:`Le ${n} et les ${k} voisins par ${u}`,
    ans:(2*k+1)*u,hint:`${2*k+1} numéros en plein × ${u}`,wheelFocus:neighbors(n,k)};
}

/* ---------------- ANNONCES ---------------- */
function genAnnonces(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets;
  const a=pick(ANNONCES);
  if(L===1){
    const t=pick(['chips','nums','belong']);
    if(t==='chips')return {game:'annonces',ctx:'Nombre de pièces',q:`${a.n} : combien de pièces ?`,ans:a.p,
      hint:a.bets.map(b=>`${b.c} ${b.t}`).join(' · '),ann:a.id};
    if(t==='nums')return {game:'annonces',ctx:'Numéros couverts',q:`${a.n} : combien de numéros ?`,ans:annNums(a).length,
      hint:a.alias,ann:a.id};
    const num=rnd(0,36),z=zoneOf(num);
    return {game:'annonces',ctx:'Appartenance',q:`Le ${num} appartient à quelle annonce ?`,
      choices:ZONES.map(x=>x.short),ansIdx:ZONES.findIndex(x=>x.id===z.id),
      hint:`${z.n} — ${z.alias}`,ann:z.id,annHit:num};
  }
  if(L===2){
    if(coin()){const u=pick(B);
      return {game:'annonces',ctx:'Mise totale',q:`${a.n} par ${u}`,ans:a.p*u,
        hint:`${a.p} pièces × ${u}`,ann:a.id};}
    const num=rnd(0,36),z=zoneOf(num);
    return {game:'annonces',ctx:'Appartenance',q:`Le ${num} appartient à quelle annonce ?`,
      choices:ZONES.map(x=>x.short),ansIdx:ZONES.findIndex(x=>x.id===z.id),
      hint:`${z.n} — ${z.alias}`,ann:z.id,annHit:num};
  }
  if(L===3){
    const num=pick(annNums(a));
    const bets=annBetsOn(a,num);
    return {game:'annonces',ctx:'Paiement en pièces',q:`${a.n} · le ${num} sort`,ans:annPay(a,num),
      hint:bets.map(b=>`${b.c} ${b.t} = ${b.c}×${b.r}`).join(' + '),ann:a.id,annHit:num};
  }
  if(L===4){
    const t=pick(['pay','fin','tricky']);
    if(t==='fin'){const f=pick(FINALES),u=pick(B);
      return {game:'annonces',ctx:'Finale en plein',q:`Finale ${f.d} par ${u} : mise totale ?`,ans:f.p*u,
        hint:`${f.nums.join(' · ')} → ${f.p} numéros`};}
    if(t==='tricky'){
      const o=ANNONCES[2];
      return {game:'annonces',ctx:'Orphelins · le piège',q:`Orphelins par 1 · le 17 sort`,ans:annPay(o,17),
        hint:'Le 17 est couvert par 2 chevaux (14/17 et 17/20) → 17 + 17',ann:'orph',annHit:17};
    }
    const num=pick(annNums(a)),u=pick(B);
    return {game:'annonces',ctx:'Paiement en espèces',q:`${a.n} par ${u} · le ${num} sort`,ans:annPay(a,num)*u,
      hint:`${annPay(a,num)} pièces × ${u}`,ann:a.id,annHit:num};
  }
  const t=pick(['net','mc','fin']);
  const num=pick(annNums(a)),u=pick(B);
  if(t==='net')
    return {game:'annonces',ctx:'Gain net',q:`${a.n} par ${u} · le ${num} sort · net ?`,ans:annPay(a,num)*u-a.p*u,
      hint:`Gain ${annPay(a,num)*u} moins la mise ${a.p*u}`,ann:a.id,annHit:num};
  if(t==='mc'){
    const back=sum(annBetsOn(a,num).map(b=>b.c));
    return {game:'annonces',ctx:'Mise comprise',q:`${a.n} par ${u} · le ${num} sort · avec les mises gagnantes ?`,
      ans:(annPay(a,num)+back)*u,hint:`${annPay(a,num)} de gain + ${back} pièce(s) misée(s) rendue(s)`,ann:a.id,annHit:num};
  }
  const f=pick(FINALES),u2=pick(B);
  return {game:'annonces',ctx:'Finale · paiement',q:`Finale ${f.d} par ${u2} · un numéro sort`,ans:u2*35,
    hint:'Un seul plein touche → 35 fois la pièce'};
}

/* ---------------- COMBINAISONS DE PAIEMENT ---------------- */
function genCombos(d){
  const L=effL(LVL[d]),B=DIFFS[d].bets;
  if(L===1){
    const t=pick(INSIDE),k=rnd(2,4);
    return pictureQ([[k,t.r,t.n]]);
  }
  if(L===2)return coin()?pictureQ(mkPicture(2,2)):pictureQ(mkPicture(2,3));
  if(L===3){
    if(coin())return pictureQ(mkPicture(rnd(2,3),4));
    const f=pick(FIGURES);
    return {game:'roulette',ctx:'Figure classique',q:f.n,ans:figVal(f),
      hint:f.parts.map(p=>`${p[0]}×${p[1]}`).join(' + '),parts:f.parts};
  }
  if(L===4){
    if(coin())return pictureQ(mkPicture(rnd(2,3),4),pick([5,10,25]));
    const f=pick(FIGURES),k=rnd(2,4);
    return {game:'roulette',ctx:'Figure empilée',q:`${f.n} × ${k}`,ans:figVal(f)*k,
      hint:`${f.n} = ${figVal(f)} pièces, le tout × ${k}`,parts:f.parts.map(p=>[p[0]*k,p[1]])};
  }
  if(coin())return pictureQ(mkPicture(rnd(3,4),6),pick([5,10,25]));
  const f=pick(FIGURES.slice(3)),k=rnd(2,4),u=pick(B.filter(x=>x<=25));
  return {game:'roulette',ctx:`Figure · pièces de ${u}`,q:`${f.n} × ${k}`,ans:figVal(f)*k*u,
    hint:`${figVal(f)} pièces × ${k} × ${u}`,parts:f.parts.map(p=>[p[0]*k,p[1]]),denom:u};
}
const genCombosG=d=>{const q=genCombos(d);q.game='combos';return q;};

/* ---------------- PAIEMENTS ROULETTE (types de paris réglables) ---------------- */
function activeBets(opts){
  const ids=(opts&&opts.bets&&opts.bets.length)?opts.bets:DEF_BETS;
  const list=BET_TYPES.filter(b=>ids.includes(b.id));
  return list.length?list:BET_TYPES.filter(b=>DEF_BETS.includes(b.id));
}
function genPaiements(d,opts){
  const L=effL(LVL[d]),B=DIFFS[d].bets,bet=()=>pick(B);
  const T=activeBets(opts);
  const one=()=>{const t=pick(T),b=bet();return {t,b};};
  if(L===1){
    const {t,b}=one();
    return {game:'paiements',ctx:'Paiement · '+t.n,q:`${b} × ${t.r}`,ans:b*t.r,hint:`${t.n} = ${t.r} pour 1`};
  }
  if(L===2){
    if(coin()){const {t,b}=one();
      return {game:'paiements',ctx:'Mise comprise · '+t.n,q:`${b} × ${t.r+1}`,ans:b*(t.r+1),hint:'Gain + mise rendue'};}
    const a=one(),c=one();
    return {game:'paiements',ctx:'2 paris gagnants',q:`(${a.b}×${a.t.r}) + (${c.b}×${c.t.r})`,
      ans:a.b*a.t.r+c.b*c.t.r,hint:`${a.t.n} + ${c.t.n}`};
  }
  if(L===3){
    if(coin()){const t=pick(T),n=rnd(2,5),b=bet();
      return {game:'paiements',ctx:`${n} paris identiques · ${t.n}`,q:`${b} × ${t.r} × ${n}`,
        ans:b*t.r*n,hint:`${n} fois le même paiement`};}
    const ps=Array.from({length:3},one);
    return {game:'paiements',ctx:'3 paris gagnants',q:ps.map(x=>`(${x.b}×${x.t.r})`).join(' + '),
      ans:sum(ps.map(x=>x.b*x.t.r)),hint:ps.map(x=>x.t.n).join(' + ')};
  }
  if(L===4){
    if(coin()){const ps=Array.from({length:3},one);
      return {game:'paiements',ctx:'3 paris · mises comprises',q:ps.map(x=>`(${x.b}×${x.t.r+1})`).join(' + '),
        ans:sum(ps.map(x=>x.b*(x.t.r+1))),hint:ps.map(x=>x.t.n).join(' + ')};}
    const {t,b}=one(),k=rnd(2,4);
    return {game:'paiements',ctx:'Pièces empilées · '+t.n,q:`${k} pièces de ${b} × ${t.r}`,
      ans:k*b*t.r,hint:`${k} × ${b} = ${k*b} misé`};
  }
  const ps=Array.from({length:4},one);
  if(coin())
    return {game:'paiements',ctx:'Rush · 4 paris',q:ps.map(x=>`(${x.b}×${x.t.r})`).join(' + '),
      ans:sum(ps.map(x=>x.b*x.t.r)),hint:ps.map(x=>x.t.n).join(' + ')};
  const tot=sum(ps.map(x=>x.b*x.t.r)),mise=sum(ps.map(x=>x.b));
  return {game:'paiements',ctx:'Gain net · 4 paris',q:`${ps.map(x=>`(${x.b}×${x.t.r})`).join(' + ')} − ${mise}`,
    ans:tot-mise,hint:'Total des gains moins les mises engagées'};
}

/* ---------------- VOISINS : citer le numéro et ses voisins ---------------- */
function genVoisins(d){
  const L=effL(LVL[d]);
  const k=L<=1?1:L<=3?2:L===4?3:4;
  const n=pick(WHEEL);
  const wheel=neighbors(n,k);          // ordre réel du cylindre, centre au milieu
  // Le croupier restitue les numéros dans l'ordre CROISSANT (comme en salle),
  // pas dans l'ordre du cylindre : c'est l'exercice « Remplir le cylindre »
  // qui travaille l'ordre de la roue.
  const seq=[...wheel].sort((a,b)=>a-b);
  return {game:'voisins',ctx:`Le ${n} et les ${k} voisins`,
    q:`Cite le ${n} et ses ${k} voisins`,
    seq,given:[seq.indexOf(n)],center:n,k,
    seqHelp:'Dans l’ordre croissant, du plus petit au plus grand',
    hint:seq.join(' · '),
    revealFocus:wheel,revealHi:[n]};
}

/* ---------------- REMPLIR LE CYLINDRE ---------------- */
const FILL_LEN={1:5,2:9,3:13,4:19,5:37};
function genWheelfill(d){
  const len=FILL_LEN[LVL[d]]||9;
  const start=len===37?0:pick(WHEEL);
  const i0=wIdx(start);
  const seq=Array.from({length:len},(_,i)=>WHEEL[(i0+i)%37]);
  return {game:'wheelfill',ctx:len===37?'Cylindre entier':`${len} cases à la suite`,
    q:len===37?'Reconstitue tout le cylindre à partir du 0'
              :`Continue le cylindre à partir du ${start}`,
    seq,given:[0],start,
    seqHelp:'Sens horaire, case après case',
    hint:`Départ ${start} → ${seq[1]} → ${seq[2]}…`,
    revealFocus:seq,revealHi:[start],wheelBoard:true};
}

const GENS={roulette:genRoulette,paiements:genPaiements,combos:genCombosG,cylindre:genCylindre,
  voisins:genVoisins,wheelfill:genWheelfill,annonces:genAnnonces,
  blackjack:genBlackjack,baccarat:genBaccarat,texas:genTexas,ultimate:genUltimate,chips:genChips,tables:genTables};
/* le Mix évite les exercices de mémoire longs (séquences) : ils ont leur propre mode */
const MIX_GAMES=['roulette','paiements','combos','cylindre','annonces','blackjack','baccarat','texas','ultimate','chips','tables'];
function genQuestion(game,d,tables,opts){
  if(game==='mix')game=pick(MIX_GAMES);
  if(game==='tables')return genTables(d,tables);
  if(game==='chips')return genChips(d,opts);
  if(game==='paiements'||game==='combos')return GENS[game](d,opts);
  return GENS[game](d);
}

function beep(freq,dur,type='sine',vol=0.12,when=0){
  if(!S.settings.sound)return;

  }catch(e){}
}

/* ---------- enregistrement des réponses ---------- */
function recordAnswer(ok,q,ms,sess){
  const before={rank:getRank(S.xp),level:levelInfo(S.xp).level};
  const td=todayStr();
  // streak quotidien
  if(S.lastDay!==td){
    const y=new Date();y.setDate(y.getDate()-1);
    const ys=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    S.streakDays=(S.lastDay===ys)?(S.streakDays||0)+1:1;
    S.lastDay=td;
  }
  S.total++;if(ok)S.correct++;
  const g=S.byGame[q.game]||{c:0,t:0};g.t++;if(ok)g.c++;S.byGame[q.game]=g;
  S.daily[td]=(S.daily[td]||0)+1;
  if(ms!=null){S.timeMs+=ms;S.timeN++;}
  // erreurs
  if(!ok&&!q.isRevision){
    if(!S.errors.some(e=>e.q===q.q))S.errors.push({q:q.q,ans:q.ans,ctx:q.ctx,game:q.game,dec:q.dec,
      hint:q.hint,choices:q.choices,ansIdx:q.ansIdx,ann:q.ann,annHit:q.annHit,
      wheelFocus:q.wheelFocus,wheelHi:q.wheelHi,parts:q.parts,denom:q.denom});
    if(S.errors.length>60)S.errors=S.errors.slice(-60);
  }
  if(ok&&q.isRevision)S.errors=S.errors.filter(e=>e.q!==q.q);
  // XP
  let xpGain=0;
  if(ok){
    const comboMult=Math.min(1+Math.floor(sess.combo/4),3);
    const speedBonus=(sess.qLimit&&ms!=null&&ms<sess.qLimit*400)?5:0;
    xpGain=Math.round(BASE_XP*DIFFS[sess.diff].xp*comboMult)+speedBonus;
    if(sess.mode==='survie')xpGain=Math.round(xpGain*1.2);
    S.xp+=xpGain;
  }
  // défis du jour (tout mode confondu)
  if(ok){
    if(!S.challs[td])S.challs[td]={};
    if(!S.challDone[td])S.challDone[td]={};
    todayChalls().forEach(ch=>{
      if(ch.game===q.game||(ch.game==='mix')){
        S.challs[td][ch.id]=(S.challs[td][ch.id]||0)+1;
        if(S.challs[td][ch.id]>=ch.target&&!S.challDone[td][ch.id]){
          S.challDone[td][ch.id]=true;S.xp+=CHALL_BONUS;
          toast('🎯',`Défi ${GAMES[ch.game].name} réussi !`,`+${CHALL_BONUS} XP bonus`,true);
          confetti(30);sfx.combo();
        }
      }
    });
  }
  // montées de grade / niveau
  const after={rank:getRank(S.xp),level:levelInfo(S.xp).level};
  if(after.rank.id!==before.rank.id){toast(after.rank.icon,`Promotion : ${after.rank.name} !`,'Nouveau grade débloqué',true);confetti(70);sfx.rank();vibe([40,60,40,60,120]);}
  else if(after.level>before.level){toast('⬆️',`Niveau ${after.level} !`,null,true);sfx.combo();}
  save();
  return xpGain;
}

/* ============================ MOTEUR DE JEU ============================ */
let sess=null;
let tick=null;
/* Enchaînement différé (question suivante, fin de partie) lié à LA session en
   cours : si le joueur quitte et relance une partie entre-temps, l'ancien
   minuteur ne doit pas sauter une question de la nouvelle partie. */
function later(fn,ms){const s=sess;setTimeout(()=>{if(sess===s&&s&&!s.over)fn();},ms);}

function startSession(game,mode,diff,tables,revision){
  if(tick)clearInterval(tick);
  sess={
    game,mode,diff,tables:tables||[...UI.selTables],
    opts:{bets:[...(S.opts.bets||DEF_BETS)],chips:[...(S.opts.chips||DEF_CHIPS)]},
    ok:0,err:0,combo:0,bestCombo:0,xp:0,
    lives:mode==='survie'?3:0,
    chrono:mode==='chrono'?60:0,
    qLimit:0,qLeft:0,q:null,ans:'',locked:false,
    qStart:0,times:[],paused:false,over:false,
    seqIdx:0,seqVals:[],
    isRevision:!!revision,queue:revision?pickN(S.errors,S.errors.length):null,
    started:Date.now()
  };
  render('game');
  nextQ();
  tick=setInterval(gameTick,100);
}

function questionTime(){
  const base=DIFFS[sess.diff].time;
  if(sess.mode==='libre')return 0;
  if(sess.mode==='chrono')return 0;
  // sur une séquence, le temps s'applique à chaque case, pas à toute la suite
  if(sess.mode==='survie')return Math.max(base*0.45,base*(1-sess.ok*0.018));
  return base;
}

function nextQ(){
  if(sess.isRevision){
    if(!sess.queue.length){endSession();return;}
    const e=sess.queue.shift();
    sess.q={...e,isRevision:true};
  }else{
    sess.q=genQuestion(sess.game,sess.diff,sess.tables,sess.opts);
  }
  sess.ans='';sess.locked=false;sess.pickedIdx=null;
  // préparation d'une question en séquence : les cases données sont pré-remplies
  if(sess.q.seq){
    sess.seqIdx=0;
    sess.seqVals=sess.q.seq.map((v,i)=>(sess.q.given||[]).includes(i)?{v,ok:true,given:true}:null);
    while(sess.seqIdx<sess.q.seq.length&&sess.seqVals[sess.seqIdx])sess.seqIdx++;
  }else{sess.seqIdx=0;sess.seqVals=[];}
  sess.qLimit=questionTime();sess.qLeft=sess.qLimit;
  sess.qStart=Date.now();
  paintQuestion();
}

/* libellé d'une case de séquence, réutilisé comme question de révision */
function seqSlotLabel(q,i){
  if(q.game==='voisins')
    return `Le ${q.center} et les ${q.k} voisins · ${ordinal(i+1)} numéro dans l’ordre croissant ?`;
  return `Numéro après le ${q.seq[i-1]} sur le cylindre ?`;
}

/* validation d'une case de séquence : chaque case compte comme une réponse */
function submitSeq(){
  const q=sess.q,i=sess.seqIdx;
  if(i>=q.seq.length)return;
  const raw=sess.ans;
  if(raw==='')return;
  const v=parseInt(raw,10);
  if(isNaN(v))return;
  const ok=v===q.seq[i];
  const ms=Date.now()-sess.qStart;
  sess.seqVals[i]={v,ok};
  sess.times.push(ms);
  // enregistrer la case comme une réponse à part entière (stats, XP, révision)
  const slotQ={game:q.game,ctx:q.ctx,q:seqSlotLabel(q,i),ans:q.seq[i],isRevision:q.isRevision};
  if(ok){
    sess.ok++;sess.combo++;sess.bestCombo=Math.max(sess.bestCombo,sess.combo);
    if(sess.combo>S.bestStreak)S.bestStreak=sess.combo;
    sess.xp+=recordAnswer(true,slotQ,ms,sess);
    sfx.ok();vibe(14);
    if(sess.combo%5===0){confetti(18);sfx.combo();}
  }else{
    sess.err++;sess.combo=0;
    recordAnswer(false,slotQ,ms,sess);
    sfx.ko();vibe([50,30,50]);
    if(sess.mode==='survie')sess.lives--;
  }
  sess.ans='';
  // avancer jusqu'à la prochaine case à remplir
  do{sess.seqIdx++;}while(sess.seqIdx<q.seq.length&&sess.seqVals[sess.seqIdx]);
  paintSeq();paintStats();
  if(sess.mode==='survie'&&sess.lives<=0){sess.locked=true;later(endSession,1200);return;}
  if(sess.seqIdx>=q.seq.length){ // séquence terminée
    sess.locked=true;
    const allOk=sess.seqVals.every(s=>s&&s.ok);
    paintSeqDone(allOk);
    later(nextQ,allOk?900:2200);
  }else{
    sess.qStart=Date.now();sess.qLeft=sess.qLimit;
  }
}

function gameTick(){
  if(!sess||sess.over||sess.paused||sess.locked)return;
  if(sess.mode==='chrono'){
    sess.chrono-=0.1;
    const el=$('g-clock');if(el)el.textContent=fmtClock(Math.max(0,Math.ceil(sess.chrono)));
    const b=$('g-tfill');
    if(b){const p=Math.max(0,sess.chrono/60*100);b.style.width=p+'%';b.className=p<20?'d':p<45?'w':'';}
    if(sess.chrono<=0){endSession();return;}
  }
  if(sess.qLimit>0){
    sess.qLeft-=0.1;
    const b=$('g-tfill');
    if(b&&sess.mode!=='chrono'){const p=Math.max(0,sess.qLeft/sess.qLimit*100);b.style.width=p+'%';b.className=p<25?'d':p<50?'w':'';}
    if(sess.qLeft<=0){
      if(sess.q&&sess.q.seq){sess.ans='-1';submitSeq();}  // case ratée, on avance
      else answerResult(false,true);
    }
  }
}

function submitAnswer(){
  if(!sess||sess.locked)return;
  if(sess.q&&sess.q.seq)return submitSeq();
  if(sess.ans===''||sess.ans==='-'||sess.ans==='.')return;
  const v=parseFloat(sess.ans.replace(',','.'));
  if(isNaN(v))return;
  answerResult(Math.abs(v-sess.q.ans)<0.001,false);
}
/* réponse à choix (annonces) */
function chooseAnswer(i){
  if(!sess||sess.locked||!sess.q.choices)return;
  sess.pickedIdx=i;
  answerResult(i===sess.q.ansIdx,false);
}

function answerResult(ok,timedOut){
  if(sess.locked)return;
  sess.locked=true;
  const ms=Date.now()-sess.qStart;
  sess.times.push(ms);
  const q=sess.q;
  if(ok){
    sess.ok++;sess.combo++;sess.bestCombo=Math.max(sess.bestCombo,sess.combo);
    if(sess.combo>S.bestStreak){S.bestStreak=sess.combo;}
    const gain=recordAnswer(true,q,ms,sess);
    sess.xp+=gain;
    sfx.ok();vibe(18);
    flyXp(gain);
    if(sess.combo%5===0){confetti(22);sfx.combo();}
  }else{
    sess.err++;sess.combo=0;
    recordAnswer(false,q,timedOut?null:ms,sess);
    sfx.ko();vibe([60,40,60]);
    if(sess.mode==='survie'){sess.lives--;}
  }
  paintFeedback(ok,timedOut);
  paintStats();
  if(sess.mode==='survie'&&sess.lives<=0){
    later(endSession,1500);
    return;
  }
  later(nextQ,ok?550:1700);
}

function endSession(){
  if(!sess||sess.over)return;
  sess.over=true;
  if(tick){clearInterval(tick);tick=null;}
  // records
  let record=false;
  if(sess.mode==='chrono'){
    const k='chrono_'+sess.diff;
    if(sess.ok>(S.bests[k]||0)){S.bests[k]=sess.ok;record=sess.ok>=5;}
  }
  if(sess.mode==='survie'){
    const k='survie_'+sess.diff;
    if(sess.ok>(S.bests[k]||0)){S.bests[k]=sess.ok;record=sess.ok>=5;}
  }
  // historique sessions
  if(sess.ok+sess.err>0){
    S.sessions.unshift({d:Date.now(),g:sess.game,m:sess.mode,df:sess.diff,ok:sess.ok,err:sess.err,xp:sess.xp,rev:sess.isRevision});
    if(S.sessions.length>20)S.sessions=S.sessions.slice(0,20);
  }
  save();
  sfx.end();
  render('results',{record});
  const acc=sess.ok+sess.err?sess.ok/(sess.ok+sess.err):0;
  if(record||acc>=0.9&&sess.ok>=8)confetti(60);
}

function flyXp(gain){
  const el=document.createElement('div');
  el.className='xpfly';el.textContent='+'+gain+' XP';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

/* ---------- clavier ---------- */
function kpress(k){
  if(!sess||sess.over)return;
  if(k==='go'){submitAnswer();return;}
  if(sess.locked)return;
  sfx.key();
  if(k==='back'){sess.ans=sess.ans.slice(0,-1);}
  else if(k==='clear'){sess.ans='';}
  else if(k==='.'){if(!sess.ans.includes('.'))sess.ans=(sess.ans||'0')+'.';}
  else{if(sess.ans.length<8)sess.ans+=k;}
  paintAns();
}
document.addEventListener('keydown',e=>{
  if(!sess||sess.over)return;
  const v=UI.view;
  if(v!=='game')return;
  if(sess.q&&sess.q.choices){ // questions à choix : touches 1-4
    const i=parseInt(e.key,10)-1;
    if(i>=0&&i<sess.q.choices.length)chooseAnswer(i);
    else if(e.key==='Escape')UI.quitGame();
    return;
  }
  if(e.key>='0'&&e.key<='9')kpress(e.key);
  else if(e.key==='.'||e.key===',')kpress('.');
  else if(e.key==='Backspace')kpress('back');
  else if(e.key==='Enter')kpress('go');
  else if(e.key==='Escape')UI.quitGame();
});
document.addEventListener('visibilitychange',()=>{if(sess&&!sess.over)sess.paused=document.hidden;});

  togBet(id){const b=S.opts.bets;S.opts.bets=b.includes(id)?b.filter(x=>x!==id):[...b,id];save();render('setup');},
  setBets(k){S.opts.bets=k==='all'?BET_TYPES.map(b=>b.id):[...DEF_BETS];save();render('setup');},
  togChip(v){const c=S.opts.chips;S.opts.chips=c.includes(v)?c.filter(x=>x!==v):[...c,v];save();render('setup');},
  setChips(k){S.opts.chips=k==='all'?CHIP_VALS.map(c=>c.v):k==='fr'?[1,2,5,10,20,50,100]:[...DEF_CHIPS];save();render('setup');},
  launch(){startSession(UI.selGame,UI.selMode,UI.selDiff,UI.selTables);},
  startChall(chId){
    const ch=todayChalls().find(c=>c.id===chId);if(!ch)return;
    UI.selGame=ch.game;UI.selMode='libre';
    startSession(ch.game,'libre',UI.selDiff,UI.selTables);
  },
  quickMode(m){UI.selGame='mix';UI.selMode=m;render('setup');},
  revision(){if(!S.errors.length)return;startSession('mix','libre',UI.selDiff,UI.selTables,true);},
  quitGame(){
    if(sess&&!sess.over&&(sess.ok+sess.err)>0){endSession();return;}
    if(tick){clearInterval(tick);tick=null;}
    if(sess)sess.over=true;sess=null;render('home');
  },
  replay(){startSession(sess.game,sess.mode,sess.diff,sess.tables,sess.isRevision);},
  stats(){render('stats');},
  learn(t){render('learn',{tab:t||'cylindre'});},
  key(k){kpress(k);},
  choose(i){chooseAnswer(i);},
  settings(){openSettings();},
  closeModal(){$('modal').innerHTML='';},
  toggle(k){S.settings[k]=!S.settings[k];save();openSettings();if(k==='sound'&&S.settings.sound)sfx.ok();if(k==='vibe'&&S.settings.vibe)vibe(30);},
  resetAll(){if(confirm('Tout réinitialiser ? Progression, XP et statistiques seront perdus.')){localStorage.removeItem(KEY);localStorage.removeItem('croupier_v43');S=defaultStats();UI.closeModal();render('home');toast('🗑️','Données réinitialisées');}}
};

function render(view,data){
  UI.view=view;
  const app=$('app');
  if(view==='home')app.innerHTML=rHome();
  else if(view==='setup')app.innerHTML=rSetup();
  else if(view==='game')app.innerHTML=rGame();
  else if(view==='results')app.innerHTML=rResults(data||{});
  else if(view==='stats')app.innerHTML=rStats();
  else if(view==='learn')app.innerHTML=rLearn((data&&data.tab)||'cylindre');
  window.scrollTo(0,0);
}

/* roue en cercle, à l'échelle, avec le numéro sélectionné et ses voisins */
function rWheelDisk(center,k){
  const R=124,cx=140,cy=140,hi=neighbors(center,k);
  const cells=WHEEL.map((n,i)=>{
    const a=(i/37)*2*Math.PI-Math.PI/2;
    const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    const on=hi.includes(n),isC=n===center;
    const fill=n===0?'#10b981':isRed(n)?'#e75c5c':'#2a2f38';
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <circle r="${isC?13:11}" fill="${fill}" opacity="${on?1:.32}" stroke="${isC?'#fff':on?'#f5c451':'none'}" stroke-width="${isC?2.5:on?1.8:0}"/>
      <text y="3.6" text-anchor="middle" font-size="${n>9?9:10}" font-weight="800" fill="#fff" opacity="${on?1:.5}">${n}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 280 280" class="wheel-disk">
    <circle cx="140" cy="140" r="${R+20}" fill="none" stroke="#222934" stroke-width="1"/>
    <circle cx="140" cy="140" r="${R-22}" fill="none" stroke="#222934" stroke-width="1"/>
    ${cells}
    <text x="140" y="130" text-anchor="middle" font-size="13" fill="#9aa3af" font-weight="700">le ${center} et les ${k}</text>
    <text x="140" y="156" text-anchor="middle" font-size="22" fill="#f4f6f8" font-weight="800">${2*k+1} numéros</text>
  </svg>`;
}
